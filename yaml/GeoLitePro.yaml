# Name: Mihomo Geo Lite Pro
# Link: https://github.com/gog-xie/Mihomo/blob/main/yaml/GeoLitePro.yaml

# 配置说明：
# 1) 本配置最多采用五层策略,略有套娃,但层次功能分明,故转层负责节点是否可用,地区策略层负责节点选择的形式,策略层级逻辑：默认代理-→ 故障转移 -→ 全球手动 -→ 地区策略 -→ 指定机场地区均衡or散列or自动or手动 -→ 该地区某节点,例如：默认代理 -→ 故障转移 -→ 全球手动 -→日本策略 -→ [主] 日本-轮询 -→ Airport1的某日本节点,"全球手动"可自定义喜欢的节点,当"全球手动"节点失联时,自动切换至下一可用区域节点,实现长时免维护；
# 2) 关于"默认直连"策略组,主要挂载了Microsoft、steam等时而需代理的域名，以及geolocation-!cn非中国域名,geolocation-!cn包含了gfw被墙域名,以及其他几乎未被墙的境外域名,含有如cloudflare、cloudfront、fastly等CDN站点,由于先滤掉了gfw被墙域名,剩下的几乎未被墙,可根据使用情况切换代理。
# 3) 需要全防泄漏,使用时将分流策略的"漏网之鱼"、“网络测试”和“默认直连”选择为任意代理节点即可(实际意义并不大)。
# 4) 本配置采用极简分流，仅需将"默认代理"选择好代理策略，以及各地区出站的方式(负载均衡、自动、手动)，当某些网站或链接不能访问时，可尝试将"默认直连"选择为代理节点，如Steam登录器大厅，登陆时需将"默认直连"设置为代理节点，游戏下载不会走代理；
# 5) 本配置可自主选择出站机场,采用多机场分别控制选择出站节点的模式,但需确保机场自定义名称前后一致；
# 6) 配置前仔细阅读配置中的相关说明,根据需要自行调整。
# 7) 使用前在“1.6代理提供者”板块中添加你的订阅链接及机场名称,并在3.4、3.5、3.6分别填入你机场名称(注意机场名称前后都有一个空格),要确保1.6与3.4、3.5、3.6中的机场名称保持一致，否则会报错。

# ↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓配置区↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓
# 1 锚点配置 
# 1.1 代理提供者锚点 - 订阅源基础配置 (根据自己机场特性,在filter参数中添加不需要的机场节点关键字,若需保留相关节点,删除该节点名称的关键字)
BaseProvider: &BaseProvider {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.google.com/generate_204', interval: 300}, filter: '^(?!.*(客户端|特殊|如果|导致|一下|教程|测试|剩余|套餐|0.5x|0.1x|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'}

# 1.2策略组类型锚点 - 定义不同的策略组基础配置
BaseFB: &BaseFB {type: fallback, interval: 200, lazy: true, proxies: [全球手动, 狮城策略, 美国策略, 台湾策略, 香港策略, 日本策略, 欧盟策略, 韩国策略, 冷门策略, 直接连接], url: 'https://www.google.com/generate_204', hidden: true}
BaseCH: &BaseCH {type: load-balance, interval: 200, lazy: true, url: 'https://www.google.com/generate_204', strategy: consistent-hashing, hidden: true}
BaseCR: &BaseCR {type: load-balance, interval: 200, lazy: true, url: 'https://www.google.com/generate_204', strategy: round-robin, hidden: true}
BaseUT: &BaseUT {type: url-test, interval: 200, lazy: true, url: 'https://www.google.com/generate_204', hidden: true}

# 1.3 规则集行为锚点
BehaviorDN:    &BehaviorDN {type: http, behavior: domain,    format: mrs,  interval: 86400}
BehaviorDY:    &BehaviorDY {type: http, behavior: domain,    format: yaml, interval: 86400}
BehaviorIP:    &BehaviorIP {type: http, behavior: ipcidr,    format: mrs,  interval: 86400}
BehaviorCY:    &BehaviorCY {type: http, behavior: classical, format: yaml, interval: 86400}

# 1.4 节点筛选正则表达式 - 基于地理位置和关键词过滤
FilterHK: &FilterHK '^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG))(?!.*(排除1|排除2|5x)).*$'
FilterSG: &FilterSG '^(?=.*(?i)(坡|🇸🇬|SG|Sing|SIN|XSP))(?!.*(排除1|排除2|5x)).*$'
FilterJP: &FilterJP '^(?=.*(?i)(日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK))(?!.*(尼日利亚|排除2|5x)).*$'
FilterKR: &FilterKR '^(?=.*(?i)(韩|🇰🇷|韓|首尔|南朝鲜|KR|KOR|Korea|South))(?!.*(排除1|排除2|5x)).*$'
FilterUS: &FilterUS '^(?=.*(?i)(美|🇺🇸|US|USA|JFK|SJC|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD))(?!.*(Plus|Australia|5x)).*$'
FilterTW: &FilterTW '^(?=.*(?i)(台|🇼🇸|🇹🇼|TW|tai|TPE|TSA|KHH))(?!.*(排除1|排除2|5x)).*$'
FilterUK: &FilterUK '^(?=.*(?i)(英|英国|UK|大不列颠|伦敦|Kingdom))(?!.*(排除1|排除2|5x)).*$'
FilterEU: &FilterEU '^(?=.*(?i)(奥|比|保|克罗地亚|塞|捷|丹|爱沙|芬|法|德|希|匈|爱尔|意|拉|立|卢|马其它|荷|波|葡|罗|斯洛伐|斯洛文|西|瑞|英|🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇫🇷|🇩🇪|🇮🇪|🇮🇹|🇱🇹|🇱🇺|🇳🇱|🇵🇱|🇸🇪|🇬🇧|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU))(?!.*(排除1|排除2|5x)).*$'
FilterOT: &FilterOT '^(?!.*(DIRECT|直接连接|美|港|坡|台|新|日|韩|奥|比|保|克罗地亚|塞|捷|丹|爱沙|芬|法|德|希|匈|爱尔|意|拉|立|卢|马其它|荷|波|葡|罗|斯洛伐|斯洛文|西|瑞|英|🇭🇰|🇼🇸|🇹🇼|🇸🇬|🇯🇵|🇰🇷|🇺🇸|🇬🇧|🇦🇹|🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇫🇷|🇩🇪|🇮🇪|🇮🇹|🇱🇹|🇱🇺|🇳🇱|🇵🇱|🇸🇪|HK|TW|SG|JP|KR|US|GB|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU|HKG|TPE|TSA|KHH|SIN|XSP|NRT|HND|KIX|CTS|FUK|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|LHR|LGW))'
FilterAL: &FilterAL '^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'

# 1.5 策略组代理锚点 - 预定义的代理节点优先级排序
SelectPY: &SelectPY {type: select, proxies: [故障转移, 狮城策略, 美国策略, 香港策略, 日本策略, 台湾策略, 韩国策略, 欧盟策略, 冷门策略, 全球手动, 直接连接]}
SelectDC: &SelectDC {type: select, proxies: [直接连接, 默认直连, 默认代理, 故障转移, 狮城策略, 美国策略, 香港策略, 日本策略, 台湾策略, 韩国策略, 欧盟策略, 冷门策略, 全球手动]}

# 1.6 代理提供者 
# 注意：
#     1) 填入机场订阅链接,每个机场一行,并为每个机场命名,视情况启用多个机场。末尾的[主][备]为每个节点添加机场名称前缀,可自定义。
#     2) 本配置默认为2个机场，如果需减少或增加机场，需在同步修订3.3、3.4、3.5、3.6，否则会报错。
#     3) 如果只有1个机场，那需删除或注释掉其中一个Airport，同时将3.3相应的机场策略删除掉(如删除掉所有[备]的策略)，以及同步注释或删除掉该Airport的3.4、3.5、3.6策略组，否则会报错。
proxy-providers: 
  # Airport1订阅源 - 首选机场节点集合，使用时请修改(注意：修改机场名称Airport1，3.3、3.4-3.6机场名称也需保持一致，否则会报错，也可以保持机场默认名称Airport1)
  Airport1: {<<: *BaseProvider, url: 'Airport1订阅源地址', override: {additional-prefix: '[主] '}}
  # Airport2订阅源 - 次选机场节点集合，使用时请修改(注意：修改机场名称Airport2，3.3、3.4-3.6机场名称也需保持一致，否则会报错，也可以保持机场默认名称Airport2)
  Airport2: {<<: *BaseProvider, url: 'Airport2订阅源地址', override: {additional-prefix: '[备] '}}

# 2 核心配置
# 2.1 基础配置
mode: rule
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true
log-level: warning
bind-address: '*'
find-process-mode: 'always'
keep-alive-interval: 15
keep-alive-idle: 600
# global-client-fingerprint: chrome

# 2.2 认证配置
authentication:
  - mihomo:mihomo
skip-auth-prefixes:
  - 192.168.50.0/24
  - 192.168.31.0/24
  - 192.168.100.0/24
  - 127.0.0.1/8

# 2.3 实验性功能
experimental:
  quic-go-disable-gso: true  
     
# 2.4管理面板配置
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090
secret: mihomo

# 2.5 配置存储
profile:
  store-selected: true
  store-fake-ip: true

# 2.6 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 2.7 TUN模式配置
tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# 2.8本地静态域名映射表(优先级最高,用来强制把某个域名解析到指定 IP,不走 DNS、不经过规则判断)
hosts:
  "epdg.epc.mnc010.mcc234.pub.3gppnetwork.org": [87.194.8.8, 87.194.88.8, 87.194.89.8, 87.194.9.8]
  services.googleapis.cn: services.googleapis.com
  cn.bing.com: www4.bing.com
  dns.alidns.com: [223.5.5.5, 223.6.6.6, 2400:3200::1, 2400:3200:baba::1]
  doh.pub: [1.12.12.12, 1.12.12.21, 120.53.53.53]
  dns.google: [8.8.8.8, 8.8.4.4, 2001:4860:4860::8888, 2001:4860:4860::8844]
  cloudflare-dns.com: [1.1.1.1, 1.0.0.1, 2606:4700:4700::1111, 2606:4700:4700::1001]
    
# 2.9 DNS配置
dns:
  enable: true
  ipv6: true
  use-hosts: true
  listen: 0.0.0.0:1053
  fake-ip-range: 198.18.0.1/16
  enhanced-mode: fake-ip
  respect-rules: true
  fake-ip-filter-mode: blacklist  
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query  
    #- https://dns.google/dns-query
    #- https://cloudflare-dns.com/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:          #本条按需启用,如果开启了rule-set项,对应“6 规则集”的项目也需同时启用
    - rule-set:fakeip-filter
    - GEOSITE:private
    - GEOSITE:cn
    - '+.pub.3gppnetwork.org'
    - "+.bing.com"
    - +.miwifi.com
    - +.docker.io
    - +.market.xiaomi.com
    - +.push.apple.com

# 3 代理策略组 
proxy-groups:
  # 3.1 业务策略组
  - {name: 默认代理,     <<: *SelectPY, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/Proxy.png}
  - {name: 默认直连,     type: select, proxies: [直接连接, 默认代理, 故障转移, 狮城策略, 美国策略, 香港策略, 日本策略, 台湾策略, 韩国策略, 欧盟策略, 冷门策略, 全球手动], icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Static.png}
  - {name: 故障转移,     <<: *BaseFB,   icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/Back.png}

  # 3.2 策略组与地理策略组分界识别
  - {name: 漏网之鱼,     <<: *SelectDC, include-all: true, filter: *FilterAL, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/Final.png}
  - {name: 网络测试,     <<: *SelectDC, include-all: true, filter: *FilterAL, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/Speedtest.png}
  - {name: 直接连接,     type: select, proxies: [DIRECT], hidden: true, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/Direct.png}

  # 3.3 地理策略组 (如果喜欢策略组更整洁,去掉各个具体的节点,可删除掉本小节的include-all和filte参数)
  - {name: 狮城策略,     type: select, proxies: ['[主] 狮城-轮询', '[备] 狮城-轮询', '[主] 狮城-散列', '[备] 狮城-散列', '[主] 狮城-自动', '[备] 狮城-自动'], include-all: true, filter: *FilterSG, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/Singapore.png}
  - {name: 香港策略,     type: select, proxies: ['[主] 香港-轮询', '[备] 香港-轮询', '[主] 香港-散列', '[备] 香港-散列', '[主] 香港-自动', '[备] 香港-自动'], include-all: true, filter: *FilterHK, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/Hong_Kong.png}
  - {name: 日本策略,     type: select, proxies: ['[主] 日本-轮询', '[备] 日本-轮询', '[主] 日本-散列', '[备] 日本-散列', '[主] 日本-自动', '[备] 日本-自动'], include-all: true, filter: *FilterJP, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/Japan.png}
  - {name: 美国策略,     type: select, proxies: ['[主] 美国-轮询', '[备] 美国-轮询', '[主] 美国-散列', '[备] 美国-散列', '[主] 美国-自动', '[备] 美国-自动'], include-all: true, filter: *FilterUS, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/United_States.png}
  - {name: 台湾策略,     type: select, proxies: ['[主] 台湾-轮询', '[备] 台湾-轮询', '[主] 台湾-散列', '[备] 台湾-散列', '[主] 台湾-自动', '[备] 台湾-自动'], include-all: true, filter: *FilterTW, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/Taiwan.png}
  - {name: 欧盟策略,     type: select, proxies: ['[主] 欧盟-轮询', '[备] 欧盟-轮询', '[主] 欧盟-散列', '[备] 欧盟-散列', '[主] 欧盟-自动', '[备] 欧盟-自动'], include-all: true, filter: *FilterEU, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/European_Union.png}
  - {name: 韩国策略,     type: select, proxies: ['[主] 韩国-轮询', '[备] 韩国-轮询', '[主] 韩国-散列', '[备] 韩国-散列', '[主] 韩国-自动', '[备] 韩国-自动'], include-all: true, filter: *FilterKR, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/Korea.png}
  - {name: 冷门策略,     type: select, proxies: ['[主] 冷门-轮询', '[备] 冷门-轮询', '[主] 冷门-散列', '[备] 冷门-散列', '[主] 冷门-自动', '[备] 冷门-自动'], include-all: true, filter: *FilterOT, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/Europe_Map.png}

  # 3.4 负载均衡-散列  (需更改机场名称,与1.6小节机场名称一致)
  - {name: '[主] 香港-散列', <<: *BaseCH, use: [ Airport1 ], filter: *FilterHK, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/Round_Robin_1.png}
  - {name: '[主] 台湾-散列', <<: *BaseCH, use: [ Airport1 ], filter: *FilterTW, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/Round_Robin_1.png}
  - {name: '[主] 狮城-散列', <<: *BaseCH, use: [ Airport1 ], filter: *FilterSG, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/Round_Robin_1.png}
  - {name: '[主] 日本-散列', <<: *BaseCH, use: [ Airport1 ], filter: *FilterJP, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/Round_Robin_1.png}
  - {name: '[主] 韩国-散列', <<: *BaseCH, use: [ Airport1 ], filter: *FilterKR, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/Round_Robin_1.png}
  - {name: '[主] 美国-散列', <<: *BaseCH, use: [ Airport1 ], filter: *FilterUS, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/Round_Robin_1.png}
  - {name: '[主] 欧盟-散列', <<: *BaseCH, use: [ Airport1 ], filter: *FilterEU, icon: https://testingcf.jsdelivr.net/gh/gog-xie/Qure@master/IconSet/Color/Round_Robin_1.png}
