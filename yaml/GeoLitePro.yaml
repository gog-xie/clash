# 4 规则路由 (按照从上往下的顺序遍历,优先命中上位规则,规则重复无影响,修改顺序会影响分流效果)
rules: 
  # 4.1 拦截规则(按需启用,可禁用拦截,不影响使用效果)
  - GEOSITE,category-ads-all,REJECT     # 轻量化广告拦截列表,搭配AWAvenueAds秋风广告列表使用,同时禁用adblock广告过滤列表
  - RULE-SET,AWAvenueAds,REJECT         # 秋风广告过滤列表,搭配category-ads-all广告列表使用,同时禁用adblock广告过滤列表
  - RULE-SET,adblock,REJECT             # adblock广告过滤列表,与秋风、category-ads-all广告列表单独使用
  
  # 4.2 特殊设置:192.168.50.101 ~ 199 所有设备走直连（本条规则解决内网大部分设备不需代理，如智能家居设备，负责DHCP的路由器的DHCP范围需设置为192.168.50.101 ~ 199，视个人需求修订）
  #- SRC-IP-CIDR,192.168.50.101/32,DIRECT,no-resolve
  #- SRC-IP-CIDR,192.168.50.102/31,DIRECT,no-resolve
  #- SRC-IP-CIDR,192.168.50.104/30,DIRECT,no-resolve
  #- SRC-IP-CIDR,192.168.50.108/30,DIRECT,no-resolve
  #- SRC-IP-CIDR,192.168.50.112/28,DIRECT,no-resolve
  #- SRC-IP-CIDR,192.168.50.128/26,DIRECT,no-resolve
  #- SRC-IP-CIDR,192.168.50.192/29,DIRECT,no-resolve
  
  # 内网设备(192.168.50.58、::abcd:1234:efgh:5678/64)部分代理,其余直连
  #- RULE-SET,My_Proxy,默认代理
  #- SRC-IP-CIDR,192.168.50.58/32,DIRECT,no-resolve
  #- SRC-IP-SUFFIX,::abcd:1234:efgh:5678/64,DIRECT,no-resolve  #某内网设备通过IPV6地址实现部分代理其余直连，由于路由器重启后IPV6前四段会变化，但后四段是根据MAC地址生成的，匹配后缀即可

  # 4.3 域名规则
  - RULE-SET,My_Direct,直接连接                               # 自定义直连域名
  - GEOSITE,private,直接连接                                  # 私有域名
  - GEOSITE,private,直接连接,no-resolve                       # 内网 / 保留 IP(127/8、192.168/16…)
  - RULE-SET,Custom_Direct_Domain,直接连接                    # 自定义直连域名
  - RULE-SET,Custom_Direct_IP,直接连接,no-resolve             # 自定义直连IP
  - RULE-SET,Custom_Direct_Port,直接连接                      # 自定义直连端口
  - RULE-SET,Custom_Proxy_Domain,默认代理                     # 自定义代理域名
  - RULE-SET,Custom_Proxy_IP,默认代理,no-resolve              # 自定义代理IP
  - GEOSITE,google-cn,直接连接                                # Google中国服务
  - RULE-SET,Steam_CDN_Domain,直接连接                        # Steam CDN
  - RULE-SET,Steam_CDN_IP,直接连接,no-resolve                 # Steam CDN
  - GEOSITE,category-game-platforms-download,直接连接         # 游戏平台下载
  - GEOSITE,steam@cn,直接连接                                 # Steam国区
  - GEOSITE,category-games@cn,直接连接                        # 国内游戏
  - GEOSITE,category-games-cn,直接连接                        # 国区游戏平台
  - GEOSITE,category-games,默认直连                           # 游戏平台(含category-games-cn、Steam)
  - GEOSITE,category-public-tracker,直接连接                  # BT Tracker
  - GEOSITE,category-pt,直接连接                              # PT站
  - RULE-SET,Speedtest,网络测试                                # 测速工具
  - GEOSITE,category-speedtest,网络测试                       # 测速工具
  - GEOSITE,test-ipv6,网络测试                                # 测速工具
  - GEOSITE,microsoft-dev@cn,直接连接                         # 国内微软开发者平台
  - GEOSITE,microsoft@cn,直接连接                             # 微软中国  
  - GEOSITE,gfw,默认代理                                      # GFW列表(主要规则,被墙列表)
  - GEOSITE,microsoft,默认直连                                # 微软服务  
  - GEOIP,google,默认代理,no-resolve                          # google IP
  - GEOIP,telegram,默认代理,no-resolve                        # Telegram IP
  - GEOIP,twitter,默认代理,no-resolve                         # Twitter IP
  - GEOIP,facebook,默认代理,no-resolve                        # Facebook IP
  - GEOIP,netflix,默认代理,no-resolve                         # Netflix IP
  - GEOIP,geolocation-!cn,默认直连                            # 非中国域名(属于gfw的父集,除gfw列表外,大多数境外域名未被墙,给gfw兜底，如果境外域名有连不上的情况，尝试"默认直连"分组切换为任意代理)
  - GEOIP,cloudflare,默认直连,no-resolve                      # cloudflare(geolocation-!cn已包含cloudflare,这里IP补充)
  - GEOIP,cloudfront,默认直连,no-resolve                      # 亚马逊旗下CDN(同上IP补充)
  - GEOIP,fastly,默认直连,no-resolve                          # FSLY CDN(同上IP补充)
  - GEOSITE,cn,直接连接                                       # 中国域名
  - GEOIP,cn,直接连接,no-resolve                              # 中国IP
  - RULE-SET,Custom_Port_Direct,直接连接                      # 非标端口
  - MATCH,漏网之鱼                                            # 漏网之鱼
  
