# 5 规则路由 （按照从上往下的顺序遍历,优先命中上位规则,规则重复无影响,修改顺序会影响分流效果）
rules: 
  # 5.1 拦截规则（部分拦截规则启用后可能导致部分网站无法打开，本条拦截规则可全部禁用，不影响使用）
  #- "DST-PORT,853,REJECT"                                       # 阻断 DOT 连接
  #- "GEOSITE,category-doh,REJECT"                               # 阻断域名类 DOH 连接
  #- "RULE-SET,Encrypted_DNS_IP,REJECT,no-resolve"               # 阻断海外 IP 类 DOH 连接
  #- "GEOSITE,category-ads,REJECT"                               # 基础广告域名
  #- "GEOSITE,category-ads-all,REJECT"                           # 全品类广告 + 跟踪
  #- "GEOSITE,category-tracking,REJECT"                          # 用户行为跟踪
  #- "GEOSITE,category-public-tracker,REJECT"                    # 公共跟踪 / 统计域名
  - "RULE-SET,Tracking,REJECT"
  - "RULE-SET,AWAvenueAds,REJECT"
  - "RULE-SET,Advertising,REJECT"
  - "RULE-SET,AdvertisingIP,REJECT,no-resolve"
  - "AND,((DST-PORT,443),(NETWORK,UDP),(NOT,((GEOIP,CN,no-resolve)))),REJECT"
  
  # 5.2 特殊设置:192.168.50.101 ~ 199 所有设备走直连（本条规则解决内网大部分设备不需代理，如智能家居设备，负责DHCP的路由器的DHCP范围需设置为192.168.50.101 ~ 199，视个人需求修订）
  - "SRC-IP-CIDR,192.168.50.101/32,DIRECT,no-resolve"
  - "SRC-IP-CIDR,192.168.50.102/31,DIRECT,no-resolve"
  - "SRC-IP-CIDR,192.168.50.104/30,DIRECT,no-resolve"
  - "SRC-IP-CIDR,192.168.50.108/30,DIRECT,no-resolve"
  - "SRC-IP-CIDR,192.168.50.112/28,DIRECT,no-resolve"
  - "SRC-IP-CIDR,192.168.50.128/26,DIRECT,no-resolve"
  - "SRC-IP-CIDR,192.168.50.192/29,DIRECT,no-resolve"
  
  # 5.3 网设备(192.168.50.58)部分代理,其余直连（本条规则解决NAS、下载机少量需代理的问题，如docker、emby刮削等需代理，其余直连，避免跑流量，视个人需求修订）
  - "RULE-SET,My_Proxy,默认代理"
  - "SRC-IP-CIDR,192.168.50.58/32,DIRECT,no-resolve"
  #- "SRC-IP-CIDR,240e:XXXX:XXXX:XXXX:XXXX:XXXX:XXXX:XXXX/128,DIRECT,no-resolve"

  # 5.4 自定义fakeip-filter域名直连,fakeip-filter中开启后,本项也需同步开启
  - "RULE-SET,fakeip-filter,直接连接"
  #- "RULE-SET,private_domain,直接连接"
  #- "RULE-SET,cn_domain,直接连接"
  #- "RULE-SET,private_domain,直接连接"
  #- "RULE-SET,Private,直接连接"
  #- "RULE-SET,Direct,直接连接"
  #- "RULE-SET,XPTV,直接连接"
  #- "RULE-SET,China,直接连接"

  # 5.5 域名规则
  - "GEOSITE,private,直接连接"                                  # 私有域名
