# 1.6 机场订阅 
# 注意：
#     1) 填入机场订阅链接,可自定义机场名称。末尾的[主][备]为每个节点添加机场名称前缀,可自定义,避免不同的机场节点重名导致出错。
#     2) 本配置默认为2个机场，如果需增加机场，可同步修订3.3-3.6，若不修订，除Airport1、Airport2外的机场节点只能混合出站，无法指定出站机场。
#     3) 如果只有1个机场,建议使用RuleLite.yaml或GeoLite.yaml配置文件。或将本配置的1.5、3.3~3.8替换为RuleLite.yaml的1.5、3.3~3.8，否则会报错。
proxy-providers: 
  # Airport1订阅源 - 主机场节点集合，注意：修改机场名称Airport1，3.3-3.6机场名称也需保持一致，否则会报错，也可以保持机场默认名称Airport1
  Airport1: {<<: *BaseProvider, url: 'Airport1订阅源地址', override: {additional-prefix: '[主] '}}
  # Airport2订阅源 - 备用机场节点集合，注意：修改机场名称Airport2，3.3-3.6机场名称也需保持一致，否则会报错，也可以保持机场默认名称Airport2
  Airport2: {<<: *BaseProvider, url: 'Airport2订阅源地址', override: {additional-prefix: '[备] '}}

# 2 核心配置
# 2.1 基础配置
mode: rule                                                              # 工作模式  rule(规则模式)/ global(全局模式)/ direct(直连模式)
ipv6: true                                                              # 网络协议  是否启用 IPv6 支持
mixed-port: 7893                                                        # 监听端口  HTTP + SOCKS5 混合代理端口
allow-lan: true                                                         # 局域连接  是否允许局域网设备连接
bind-address: "*"                                                       # 监��接口  监听的网络接口(* 表示所有接口)
log-level: warning                                                      # 日志级别  silent(静默)/ error(错误)/ warning(警告)/ info(信息)/ debug(调试)
unified-delay: true                                                     # 统一延迟  减少节点延迟抖动
tcp-concurrent: true                                                    # 并发连接  提升多任务性能
profile: { store-selected: true, store-fake-ip: true }                  # 保存选择  记住选择的节点和策略组、Fake-IP 映射

# 2.2 地理数据
geo-auto-update: true                                                   # 自动更新  geodata
geo-update-interval: 24                                                 # 更新间隔  单位:小时
geodata-mode: true                                                      # 数据分流  使用数据集进行规则与分流匹配
geox-url:
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  geoip:   https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  mmdb:    https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb
  asn:     https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb

# 2.3 认证配置
authentication:
  - mihomo:mihomo

# 2.4管理面板配置
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-controller: 0.0.0.0:9090                                       # 面板地址
external-ui-name: zashboard                                             # 面板名称
external-ui: ui                                                         # 面板目录
secret: 12345678                                                        # 面板密码

# 2.5 TUN模式配置
tun:
  enable: true                                                          # 网卡模式  是否启用 TUN 虚拟网卡模式  
  stack: mixed                                                          # 协议类型  网络栈:system(系统栈)/ gvisor(内置用户态栈)/ mixed(混合)
  dns-hijack: [udp://any:53, tcp://any:53]                              # 劫持请求  劫持所有 UDP/TCP 53 端口的 DNS 请求
  auto-detect-interface: true                                           # 自动出口  自动识别默认出口网络接口 (仅内核模式有效)
  auto-route: true                                                      # 自动路由  自动添加系统路由表      (仅内核模式有效)
  auto-redirect: true                                                   # 自动定向  自动将流量重定向至 TUN  (仅内核模式有效)
  strict-route: false                                                   # 路由模式  严格路由模式
  endpoint-independent-nat: true                                        # 端点无关  NAT(提高 NAT 类型兼容性,适用于 P2P 和游戏)
  route-exclude-address-set: [cn_IP]                                    # 绕过大陆  匹配大陆IP-CIDR(流量不进入代理) 

# (file continues unchanged)
