# Name: Mihomo Yaml Config - Rule Set Data & Full Beta Edition
# Link: https://github.com/gogyt/Mihomo/blob/main/yaml/RuleBeta.yaml

# 功能描述
# ──────────────────────────────────────────────────────────
#  规则来源：       ☐ 内置GEO   ☑ RULE-SET规则集      
# ──────────────────────────────────────────────────────────
#  分流程度：       ☐ 标准分流  ☐ 精简分流  ☑ 重度分流
# ──────────────────────────────────────────────────────────
#  仅内核运行：     ☑ 支持      ☐ 不支持            
# ──────────────────────────────────────────────────────────
#  广告拦截：       ☑ 支持      ☐ 不支持            
# ──────────────────────────────────────────────────────────
#  自定义故障转移:  ☑ 支持      ☐ 不支持            
# ──────────────────────────────────────────────────────────
#  多元故障转移：   ☑ 支持      ☐ 不支持            
# ──────────────────────────────────────────────────────────
#  多机场出站类型： ☑ 混合出站   ☑ 自定义出站   ☑ 指定节点出站
# ──────────────────────────────────────────────────────────

# 配置说明
# 本配置是在RluePlus.yaml版本基础上魔改而来，是测试版本。
# 增加了低倍率策略组，用于省流；
# 增加了四项手动选择，专为“故转手动”策略组提供自定义优先级排序，“故转手动”fallback的优先级排序为：手选(一) ＞ 手选(二) ＞ 手选(三) ＞ [...]
# 故转策略组不是底层节点选择策略，例如故转台湾，顾名思义，优先台湾策略组的节点，不管目前选择的是哪个策略组，当检测到台湾策略组是连��[...]
# 故障转移是确保选择的节点一直处于可用状态，同时能自定义选择节点，按喜好将相应节点或策略组优先排序，比如高倍率节点可分配给高品质需��[...]

# 配置区
# 1 锚点配置 
# 1.1 机场订阅锚点 - 订阅源基础配置 (根据自己机场特性,在filter参数中添加不需要的机场节点关键字,若需保留相关节点,删除该节点名称的关键字)
BaseProvider: &BaseProvider {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.google.com/generate_204', interval: 300}, filter: '^(?!.*(客户端|特殊|�[...]')

# 1.2策略组类型锚点 - 定义不同的策略组基础配置
BaseHS: &BaseHS {type: select}
BaseFB: &BaseFB {type: fallback,     empty-fallback: REJECT, interval: 200, lazy: true, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.google.com/generate_204'}
BaseCR: &BaseCR {type: load-balance, empty-fallback: REJECT, interval: 200, lazy: true, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.google.com/generate_204', strategy: roun[...]}
BaseCH: &BaseCH {type: load-balance, empty-fallback: REJECT, interval: 200, lazy: true, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.google.com/generate_204', strategy: cons[...]}
BaseSS: &BaseSS {type: load-balance, empty-fallback: REJECT, interval: 200, lazy: true, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.google.com/generate_204', strategy: stic[...]}
BaseUT: &BaseUT {type: url-test,     empty-fallback: REJECT, interval: 200, lazy: true, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.google.com/generate_204', tolerance: 50}

# 1.3 规则集行为锚点
BehaviorDN:   &BehaviorDN {type: http, behavior: domain,    format: mrs,  interval: 86400}
BehaviorDY:   &BehaviorDY {type: http, behavior: domain,    format: yaml, interval: 86400}
BehaviorIP:   &BehaviorIP {type: http, behavior: ipcidr,    format: mrs,  interval: 86400}
BehaviorCY:   &BehaviorCY {type: http, behavior: classical, format: yaml, interval: 86400}

# 1.4 机场节点筛选正则表达式 - 基于地理位置和关键词过滤
FilterHK:     &FilterHK '^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG)).*$'
FilterSG:     &FilterSG '^(?=.*(?i)(坡|🇸🇬|SG|Sing|SIN|XSP)).*$'
FilterJP:     &FilterJP '^(?=.*(?i)(日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK)).*$'
FilterKR:     &FilterKR '^(?=.*(?i)(韩|🇰🇷|韓|首尔|南朝鲜|KR|KOR|Korea|South)).*$'
FilterUS:     &FilterUS '^(?=.*(?i)(美|🇺🇸|US|USA|JFK|SJC|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD))(?!.*(Plus|Australia)).*$'
FilterTW:     &FilterTW '^(?=.*(?i)(台|🇼🇸|🇹🇼|TW|tai|TPE|TSA|KHH)).*$'
FilterEU:     &FilterEU '^(?=.*(?i)(奥|比|保|克罗地亚|塞|捷|丹|爱沙|芬|法|德|希|匈|爱尔|意|拉|立|卢|马其它|荷|波|葡|罗|斯洛伐|斯洛文|西|瑞|英|🇧🇪|🇨��[...]')
FilterOT:     &FilterOT '^(?!.*(DIRECT|直接连接|美|港|坡|台|新|日|韩|奥|比|保|克罗地亚|塞|捷|丹|爱沙|芬|法|德|希|匈|爱尔|意|拉|立|卢|马其它|荷|波|葡|罗|斯[...]')
FilterAL:     &FilterAL '^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|[...])'
FilterLM:     &FilterLM '^(?=.*(?i)(低倍率|低倍|(?<![\d\.])0?\.\d+(?![0-9])(?:x|倍)?|倍率[:： ]?0?\.\d+)).*$'

